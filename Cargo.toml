[package]
name = "wgbar"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A tiny macOS menu bar toggle for wg-quick WireGuard tunnels"
publish = false

[lib]
name = "wgbar"
path = "src/lib.rs"

[[bin]]
name = "WGBar"
path = "src/main.rs"

[[bin]]
name = "wgbar-helper"
path = "src/bin/wgbar-helper.rs"

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
# Only the headers WGBar uses: the default "everything" features take most of a clean build.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSPathUtilities",
    "NSNotification", "NSValue", "NSObject", "NSOperation", "NSString", "NSTimer", "NSURL",
    "NSUUID", "NSUserDefaults", "NSDate", "NSEnumerator",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "libc", "objc2-core-foundation", "NSAlert", "NSApplication", "NSButton", "NSCell",
    "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel",
    "NSResponder", "NSRunningApplication", "NSSavePanel", "NSStatusBar", "NSStatusBarButton",
    "NSStatusItem", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std", "objc2", "objc2-foundation", "SMAppService",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "UNNotificationContent", "UNNotificationRequest",
    "UNUserNotificationCenter", "UNNotificationTrigger",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true


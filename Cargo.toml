[package]
name = "wgbar"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A tiny macOS menu bar toggle for wg-quick WireGuard tunnels"
publish = false

[lib]
name = "wgbar"
path = "src/lib.rs"

[[bin]]
name = "WGBar"
path = "src/main.rs"

[[bin]]
name = "wgbar-helper"
path = "src/bin/wgbar-helper.rs"

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
objc2-user-notifications = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

